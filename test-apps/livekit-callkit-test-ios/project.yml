name: CallKitTest
options:
  bundleIdPrefix: app.chatapp.p2p
  deploymentTarget:
    iOS: "15.0"

packages:
  LiveKitClient:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.0.0

targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "*.entitlements"
          - "README.md"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CallKit Test
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chatapp.p2p.calltest
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: App.entitlements
    dependencies:
      - package: LiveKitClient
        product: LiveKit
