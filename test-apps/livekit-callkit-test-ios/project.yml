name: CallKitTest
options:
  bundleIdPrefix: app.chatapp.p2p
  deploymentTarget:
    iOS: "17.0"

packages:
  LiveKitClient:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.0.0
  SwiftLog:
    url: https://github.com/apple/swift-log.git
    from: 1.5.0

targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "*.entitlements"
          - "README.md"
          - "fastlane/**"
          - "Gemfile"
          - "Gemfile.lock"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CallKit Test
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.chatapp.p2p.calltest
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: App.entitlements
    dependencies:
      - package: LiveKitClient
        product: LiveKit
      - package: SwiftLog
        product: Logging

schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    archive:
      config: Release
