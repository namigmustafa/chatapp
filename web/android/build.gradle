// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Hardcoded (not $kotlinVersion from variables.gradle) — the buildscript
        // block evaluates before `apply from: "variables.gradle"` below runs, so
        // that ext property isn't available yet here. Keep this in sync with
        // variables.gradle's kotlinVersion.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Required by the LiveKit Android SDK's transitive dependencies (:app's
        // CallForegroundService, see infra/livekit-azure for the server side).
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
